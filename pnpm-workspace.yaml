packages:
  - apps/*
  - packages/*
  - infra

allowBuilds:
  '@scarf/scarf': false
  esbuild: true
  sharp: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.12'
  - '@turbo/darwin-arm64@2.11.12'
  - '@turbo/linux-64@2.11.12'
  - '@turbo/linux-arm64@2.11.12'
  - '@turbo/windows-64@2.11.12'
  - '@turbo/windows-arm64@2.11.12'
  - turbo@2.11.12
  - '@aws-sdk/client-s3@3.1171.0'
  - '@aws-sdk/s3-request-presigner@3.1171.0'
